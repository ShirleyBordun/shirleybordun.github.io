<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found | Shirley Bordun</title>
    
    <!-- GitHub Pages Project Subpath Router Fix -->
    <script>
        // Redirects project site 404s correctly back to index or handles state
        const segmentCount = 1; // Set to 1 for project repositories like /repo-name/
        const l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=404'
        );
    </script>

    <meta name="author" content="Shirley Bordun">
    <meta name="description" content="Official 404 error page for Shirley Bordun, Cybersecurity Engineer.">

    </script>
